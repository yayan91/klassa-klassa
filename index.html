<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLASSA - Sedang Dalam Pemeliharaan</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container Utama */
        .maintenance-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #2563eb; /* Warna Aksen Biru Profesional */
        }

        /* Logo Branding */
        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: inline-block;
            text-transform: uppercase;
        }

        /* Ikon / Ilustrasi Simpel */
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #64748b;
        }

        /* Judul Utama */
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #1e293b;
        }

        /* Deskripsi Text */
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* Tombol Kontak (Opsional) */
        .btn-contact {
            display: inline-block;
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .btn-contact:hover {
            background-color: #1d4ed8;
        }

        /* Footer Copyright */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Animasi Loading Kecil */
        .loader {
            width: 40px;
            height: 4px;
            background: #e2e8f0;
            margin: 0 auto 30px auto;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .loader::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: #2563eb;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="brand-name">KLASSA</div>
        
        <div class="loader"></div>

        <h1>Kami Segera Kembali</h1>
        <p>
            Website <strong>KLASSA</strong> sedang menjalani pemeliharaan terjadwal untuk meningkatkan layanan kami. <br>
            Kami akan kembali online sesaat lagi.
        </p>

        <a href="https://wa.me/6285259259767" class="btn-contact">Hubungi Kami</a>

        <div class="footer">
            &copy; 2026 KLASSA. Muhammad Hasratul.
        </div>
    </div>

</body>
</html>
