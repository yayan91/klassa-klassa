<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Latar belakang gradasi biru yang dalam dan modern */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* --- Background Particles (Dekorasi Visual) --- */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79,172,254,0.2) 0%, rgba(0,242,254,0.1) 100%);
            animation: move 25s infinite alternate ease-in-out;
            z-index: 0;
            filter: blur(10px);
        }
        .c1 { width: 400px; height: 400px; top: -10%; left: -10%; }
        .c2 { width: 300px; height: 300px; bottom: -5%; right: -5%; animation-duration: 18s; animation-direction: alternate-reverse; }

        @keyframes move {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(40px, 60px) rotate(20deg); }
        }

        /* --- Main Card (Glassmorphism Modern) --- */
        .container {
            position: relative;
            z-index: 1;
            /* Efek kaca yang lebih modern dan bersih */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(110%);
            -webkit-backdrop-filter: blur(25px) saturate(110%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3.5rem 2.5rem;
            border-radius: 30px;
            text-align: center;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animasi Goyang Keren untuk Judul */
        @keyframes subtleWobble {
            0%, 100% { transform: translateX(0%) rotate(0deg); }
            15% { transform: translateX(-2px) rotate(-1deg); }
            30% { transform: translateX(1px) rotate(1deg); }
            45% { transform: translateX(-1px) rotate(-0.5deg); }
            60% { transform: translateX(1px) rotate(0.5deg); }
            75% { transform: translateX(0%) rotate(0deg); }
        }

        /* --- Content Styles --- */
        .icon-box {
            /* Sedikit efek glow pada icon */
            filter: drop-shadow(0 0 15px rgba(79, 172, 254, 0.4));
            margin-bottom: 1.5rem;
            animation: floatIcon 4s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: 1.5px;
            /* Terapkan animasi goyang */
            display: inline-block;
            animation: subtleWobble 3s ease-in-out infinite;
            background: linear-gradient(to right, #ffffff, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2.5rem;
            font-weight: 400;
            line-height: 1.6;
        }

        /* --- Info Box (Centered Layout) --- */
        .info-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            margin-bottom: 2.5rem;
            /* Border accent di tengah */
            border-bottom: 3px solid #4facfe;
            /* Mengubah layout menjadi terpusat */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem; /* Jarak antar item */
        }

        .info-item {
            /* Item ditumpuk vertikal dan di tengah */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .info-icon {
            font-size: 1.8rem;
            margin-bottom: 0.8rem; /* Jarak antara ikon dan teks */
            background: rgba(79, 172, 254, 0.2);
            width: 50px;
            height: 50px;
            line-height: 50px;
            border-radius: 50%;
        }

        .info-text strong {
            display: block;
            font-size: 0.85rem;
            color: #4facfe;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .info-text span {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        /* --- Buttons & Footer --- */
        .btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            /* Warna Hijau WhatsApp Modern */
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-wa:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
        }
        
        .btn-wa i {
            margin-right: 10px;
            font-style: normal;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.5rem;
            line-height: 1.8;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .container { padding: 2.5rem 1.5rem; }
            .info-box { padding: 1.5rem; }
            .info-text span { font-size: 1rem; }
        }
    </style>
</head>
